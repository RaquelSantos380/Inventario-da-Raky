<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Inventário Da Raky" />
    <meta property="og:description" content="Confira nosso inventário completo de pets no Adopt Me!" />
    <meta property="og:url" content="https://www.seusite.com" />
    <meta property="og:image" content="Raky.jpg">
    <meta name="theme-color" content="#ffccff" />
    <title>Inventário Da Raky</title>
    <link rel="icon" type="image/png" href="Raky.jpg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* evita barras de rolagem indesejadas */
            font-family: 'Poppins', sans-serif;
        }

        /* ===== CARROSSEL EM TELA CHEIA ===== */
        .carousel {
            position: relative;
            width: 100vw;
            height: 100vh; /* ocupa a tela toda */
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0; /* top/right/bottom/left = 0 */
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        /* Imagem cobrindo toda a tela, sem distorcer */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;       /* cobre a tela inteira mantendo proporção */
            object-position: center; /* centraliza o foco */
            display: block;
            image-rendering: -webkit-optimize-contrast; /* melhora nitidez em alguns navegadores */
        }

        /* Legenda/overlay opcional */
        .slide-caption {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            font-size: 1.4rem;
            font-weight: 600;
            z-index: 2;
            padding: 0 20px;
        }

        /* Botões de navegação */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 204, 255, 0.7);
            border: none;
            color: #333;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 204, 255, 1);
        }

        .prev { left: 20px; }
        .next { right: 20px; }

        /* Indicadores (bolinhas) */
        .dots {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 3;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .dot.active {
            background: #ffccff;
            transform: scale(1.3);
        }

        /* Responsivo: em telas pequenas ajusta tamanho dos botões */
        @media (max-width: 600px) {
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .slide-caption {
                font-size: 1rem;
                bottom: 20px;
            }
            .dots {
                bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="carousel" id="carousel">
        <div class="slide active">
            <img src="Raky.jpg" alt="Slide 1">
            <div class="slide-caption">Inventário Da Raky</div>
        </div>
        <div class="slide">
            <img src="imagem2.jpg" alt="Slide 2">
            <div class="slide-caption">Pets Raros</div>
        </div>
        <div class="slide">
            <img src="imagem3.jpg" alt="Slide 3">
            <div class="slide-caption">Coleção Completa</div>
        </div>
        <!-- Adicione mais slides conforme necessário -->

        <button class="nav-btn prev" onclick="prevSlide()">&#10094;</button>
        <button class="nav-btn next" onclick="nextSlide()">&#10095;</button>

        <div class="dots" id="dots"></div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        let currentIndex = 0;
        let autoPlayInterval;

        // Cria as bolinhas dinamicamente
        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function updateSlides() {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === currentIndex);
            });
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            updateSlides();
            resetAutoPlay();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateSlides();
            resetAutoPlay();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlides();
            resetAutoPlay();
        }

        function startAutoPlay() {
            autoPlayInterval = setInterval(nextSlide, 5000); // troca a cada 5s
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }

        // Suporte a swipe (arrastar) em dispositivos móveis
        let touchStartX = 0;
        let touchEndX = 0;
        const carousel = document.getElementById('carousel');

        carousel.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        carousel.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) nextSlide();
            if (touchEndX - touchStartX > 50) prevSlide();
        }, { passive: true });

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        startAutoPlay();
    </script>

</body>
</html>
