<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Inventário Da Raky" />
    <meta property="og:description" content="Confira nosso inventário completo de pets no Adopt Me!" />
    <meta property="og:url" content="https://www.seusite.com" />
    <meta property="og:image" content="Raky.jpg">
    <meta name="theme-color" content="#ffccff" />
    <title>Inventário Da Raky</title>
    <link rel="icon" type="image/png" href="Raky.jpg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&family=Oswald:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffccff, #ff99cc, #ff66b2);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #2e2e2e;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="%23f7c6d9" /></svg>');
            opacity: 0.1;
            z-index: -1;
        }
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            background-color: #ff66b2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid #ff3f81;
        }
        .header h1 {
            font-size: 22px;
            color: white;
            font-family: 'Dancing Script', cursive;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }
        .container {
            padding: 90px 15px 15px;
            max-width: 100%;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        .profile-img {
            display: block;
            margin: 0 auto 15px;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            border: 5px solid #FFD700;
            transition: all 0.3s ease;
        }
        .profile-img:hover {
            transform: rotate(10deg) scale(1.1);
        }
        .nick-info {
            background: linear-gradient(145deg, #ffccff, #ff99cc);
            padding: 10px 12px;
            border-radius: 15px;
            margin: 10px auto;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            border: 2px dashed #ff3f81;
            max-width: 90%;
            font-size: 14px;
        }
        .nick-info span {
            color: #ff0066;
            font-size: 1em;
        }
        .welcome-text {
            text-align: center;
            margin: 10px 0;
            font-size: 1em;
            color: #333;
        }
        .welcome-text h1 {
            color: #ff3f81;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .welcome-text h2 {
            color: #ff66b2;
            margin-top: 0;
            font-size: 1.1em;
        }
        .slideshow-container {
            position: relative;
            max-width: 100%;
            height: 250px;
            margin: 15px auto;
            overflow: hidden;
            background-color: #fff7f9;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #ff99cc;
        }
        .slides {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            margin: auto;
            padding: 5px;
        }
        .seta {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 30px;
            color: #ff3f81;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seta:hover {
            transform: translateY(-50%) scale(1.1);
            background-color: white;
        }
        .seta-esquerda {
            left: 10px;
        }
        .seta-direita {
            right: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #555;
            font-weight: bold;
            padding: 10px;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .link-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: linear-gradient(145deg, #ffb3d9, #ff99cc);
            color: #fff;
            border: none;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            min-height: 90px;
            border: 2px solid white;
        }
        .link-button img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            padding: 3px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }
        .link-button:hover {
            background: linear-gradient(145deg, #ff99cc, #ff80b3);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .vendedor-pets {
            background: linear-gradient(145deg, #ff6b6b, #ff3f81);
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            font-family: 'Oswald', sans-serif;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            display: block;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 7px 20px rgba(255, 0, 102, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid white;
        }
        .vendedor-pets:hover {
            background: linear-gradient(145deg, #ff3f81, #ff0066);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 0, 102, 0.4);
        }
        .valor-botao {
            font-size: 18px;
            font-weight: bold;
            padding: 15px 25px;
            background: linear-gradient(145deg, #f09bae, #e87b94);
            color: white;
            border-radius: 25px;
            text-align: center;
            margin: 20px auto;
            display: block;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 2px solid white;
        }
        .valor-botao:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            display: none;
        }
        .loading-text {
            font-size: 20px;
            color: #ff66b2;
            font-weight: bold;
        }
        .ver-mais {
            text-align: center;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .ver-mais a {
            color: #ff3f81;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s ease;
            font-size: 1rem;
            padding: 6px 12px;
            border-radius: 15px;
            background: rgba(255,255,255,0.7);
        }
        .ver-mais a:hover {
            text-decoration: underline;
            color: #ff0066;
            background: rgba(255,255,255,0.9);
        }
        .pause-btn {
            display: block;
            margin: 10px auto;
            padding: 8px 15px;
            background: linear-gradient(145deg, #ff3f81, #ff0066);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: 2px solid white;
            font-size: 0.9rem;
        }
        .pause-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 400px) {
            .header h1 {
                font-size: 18px;
            }
            .slideshow-container {
                height: 200px;
            }
            .seta {
                font-size: 25px;
                padding: 8px;
                width: 35px;
                height: 35px;
            }
            .link-button {
                min-height: 80px;
                font-size: 0.8rem;
            }
            .vendedor-pets {
                font-size: 0.9rem;
            }
            .valor-botao {
                font-size: 16px;
            }
            .nick-info {
                font-size: 12px;
            }
        }
        .pix-info {
            background: linear-gradient(145deg, #e6f7ff, #b3e0ff);
            color: #0066cc;
            padding: 8px 10px;
            border-radius: 12px;
            margin: 8px auto;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            border: 2px dashed #0066cc;
            max-width: 90%;
            font-size: 13px;
        }
        .contador-slides {
            text-align: center;
            font-size: 0.8rem;
            color: #ff3f81;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Inventário Da Raky</h1>
    </div>

    <div class="container">
        <img src="Raky.jpg" alt="Foto de Perfil" class="profile-img">
        
        <div class="welcome-text">
            <h2>Confira nossos pets disponíveis</h2>
        </div>

        <div class="pix-info">
            Chave PIX: raquelgata780@gmail.com
        </div>
        
        <div class="nick-info">
            Entre pelo join usando o nick: <span>RaqueSantos380_2</span>
        </div>

        <!-- Slideshow Container - Imagens geradas dinamicamente -->
        <div class="slideshow-container" id="slideshow-container">
            <!-- As imagens serão inseridas aqui pelo JavaScript -->
        </div>

        <!-- Setas de navegação -->
        <span class="seta seta-esquerda" onclick="voltarSlide()">&#8249;</span>
        <span class="seta seta-direita" onclick="proximoSlide()">&#8250;</span>

        <!-- Contador de slides -->
        <div class="contador-slides" id="contador-slides"></div>

        <!-- Botão de pause/play -->
        <button class="pause-btn" id="pauseBtn" onclick="togglePause()">
            <i class="fas fa-pause"></i> Pausar Slideshow
        </button>
        
        <div class="footer" id="rodape">
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-text">Direcionando você à página...</div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO: Altere este número conforme a
        // quantidade de imagens JPG na sua pasta
        // ============================================
        const TOTAL_IMAGENS = 63; // <-- MUDE AQUI para o número total de JPGs
        
        const BASE_URL = "https://raw.githubusercontent.com/RaquelSantos380/Seja-Bem-vindo-A-LojinhaDaRaky/main/minhas%20imagens/";
        const container = document.getElementById("slideshow-container");
        
        // Array para armazenar apenas as imagens que existem
        let imagensExistentes = [];
        let slideIndex = 0;
        let slideInterval;
        let isPaused = false;
        
        // Função para verificar se uma imagem existe
        function verificarImagem(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }
        
        // Função para carregar todas as imagens
        async function carregarImagens() {
            container.innerHTML = '<div style="text-align:center;padding:50px;color:#ff66b2;">Carregando imagens... <i class="fas fa-spinner fa-spin"></i></div>';
            
            const promessas = [];
            
            // Cria array de promessas para verificar cada imagem
            for (let i = 1; i <= TOTAL_IMAGENS; i++) {
                promessas.push(verificarImagem(`${BASE_URL}${i}.jpg`));
            }
            
            // Aguarda todas as verificações
            const resultados = await Promise.all(promessas);
            
            // Limpa o container
            container.innerHTML = '';
            
            // Adiciona apenas as imagens que existem
            resultados.forEach((existe, index) => {
                if (existe) {
                    const numImagem = index + 1;
                    const img = document.createElement("img");
                    img.className = "slides";
                    img.src = `${BASE_URL}${numImagem}.jpg`;
                    img.alt = `Slide ${numImagem}`;
                    img.setAttribute('data-numero', numImagem);
                    container.appendChild(img);
                    imagensExistentes.push(numImagem);
                }
            });
            
            // Atualiza o contador
            atualizarContador();
            
            // Se encontrou imagens, inicia o slideshow
            if (imagensExistentes.length > 0) {
                mostrarSlide(0);
                startSlideShow();
            } else {
                container.innerHTML = '<div style="text-align:center;padding:50px;color:#ff3f81;">Nenhuma imagem encontrada na pasta</div>';
            }
        }
        
        // Função para atualizar o contador de slides
        function atualizarContador() {
            const contador = document.getElementById("contador-slides");
            if (imagensExistentes.length > 0) {
                contador.textContent = `${imagensExistentes.length} imagens carregadas de ${TOTAL_IMAGENS} verificadas`;
            }
        }
        
        // Funções do slideshow
        function mostrarSlide(index) {
            const slides = document.getElementsByClassName("slides");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            if (slides.length > 0) {
                slides[index].style.display = "block";
            }
        }
        
        function proximoSlide() {
            const slides = document.getElementsByClassName("slides");
            if (slides.length > 0) {
                slideIndex = (slideIndex + 1) % slides.length;
                mostrarSlide(slideIndex);
            }
        }
        
        function voltarSlide() {
            const slides = document.getElementsByClassName("slides");
            if (slides.length > 0) {
                slideIndex = (slideIndex - 1 + slides.length) % slides.length;
                mostrarSlide(slideIndex);
            }
        }
        
        function startSlideShow() {
            if (!slideInterval) {
                slideInterval = setInterval(proximoSlide, 3000);
            }
        }
        
        function stopSlideShow() {
            clearInterval(slideInterval);
            slideInterval = null;
        }
        
        function togglePause() {
            const pauseBtn = document.getElementById("pauseBtn");
            
            if (isPaused) {
                startSlideShow();
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i> Pausar Slideshow';
                isPaused = false;
            } else {
                stopSlideShow();
                pauseBtn.innerHTML = '<i class="fas fa-play"></i> Continuar Slideshow';
                isPaused = true;
            }
        }
        
        // Função para mostrar o overlay de carregamento
        function showLoading() {
            const overlay = document.getElementById("loading-overlay");
            if (overlay) {
                overlay.style.display = "flex";
                setTimeout(() => {
                    overlay.style.display = "none";
                }, 2000);
            }
        }
        
        // Inicia o carregamento das imagens quando a página carregar
        window.onload = function() {
            carregarImagens();
        };
    </script>
</body>
</html>
