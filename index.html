<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="og:title" content="Inventário Da Raky" />
    <meta name="og:description" content="Confira nosso inventário completo de pets no Adopt Me!" />
    <meta name="theme-color" content="#ffccff" />
    <title>Inventário Da Raky</title>
    <link rel="icon" type="image/png" href="Raky.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* ===== SLIDESHOW EM TELA CHEIA ===== */
        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .slides {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* Setas */
        .seta {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: #ff3f81;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .seta:hover {
            transform: translateY(-50%) scale(1.1);
            background-color: white;
        }

        .seta-esquerda {
            left: 20px;
        }

        .seta-direita {
            right: 20px;
        }

        /* Contador */
        .contador-slides {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10;
            text-align: center;
        }

        /* Status de carregamento */
        .search-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.8rem;
            font-style: italic;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
        }

        @media (max-width: 600px) {
            .seta {
                font-size: 28px;
                width: 42px;
                height: 42px;
            }
            .seta-esquerda { left: 10px; }
            .seta-direita { right: 10px; }
            .contador-slides { font-size: 0.75rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <div class="slideshow-container" id="slideshow-container">
        <!-- As imagens serão inseridas aqui pelo JavaScript -->
    </div>

    <!-- Setas -->
    <span class="seta seta-esquerda" onclick="voltarSlide()">&#8249;</span>
    <span class="seta seta-direita" onclick="proximoSlide()">&#8250;</span>

    <!-- Contador -->
    <div class="contador-slides" id="contador-slides"></div>

    <!-- Status -->
    <div class="search-status" id="search-status"></div>

    <script>
        // ============================================
        // URL DO REPOSITÓRIO
        // ============================================
        const BASE_URL = "https://raw.githubusercontent.com/RaquelSantos380/Seja-Bem-vindo-A-LojinhaDaRaky/main/minhas%20imagens/";

        const container = document.getElementById("slideshow-container");

        let slideIndex = 0;
        let slideInterval;
        let limiteMaximo = 1000;

        function verificarImagem(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                setTimeout(() => resolve(false), 3000);
            });
        }

        async function encontrarTotalImagens() {
            const statusDiv = document.getElementById("search-status");
            statusDiv.innerHTML = '<i class="fas fa-search"></i> Detectando imagens...';

            let imagensEncontradas = 0;
            let falhasConsecutivas = 0;
            let numeroAtual = 1;

            while (falhasConsecutivas < 5 && numeroAtual <= limiteMaximo) {
                const url = `${BASE_URL}${numeroAtual}.jpg`;
                const existe = await verificarImagem(url);

                if (existe) {
                    imagensEncontradas++;
                    falhasConsecutivas = 0;
                    statusDiv.innerHTML = `Detectando... ${numeroAtual}.jpg <i class="fas fa-spinner fa-spin"></i>`;
                } else {
                    falhasConsecutivas++;
                    statusDiv.innerHTML = `Verificando... ${numeroAtual}.jpg (${falhasConsecutivas}/5)`;
                }

                numeroAtual++;
            }

            statusDiv.innerHTML = `✅ ${imagensEncontradas} imagens encontradas.`;
            return imagensEncontradas;
        }

        async function carregarImagens() {
            const totalImagens = await encontrarTotalImagens();

            if (totalImagens === 0) {
                container.innerHTML = '<div style="color:#fff;text-align:center;padding:50px;">❌ Nenhuma imagem encontrada.</div>';
                document.getElementById("contador-slides").textContent = "0 imagens";
                return;
            }

            container.innerHTML = '';

            for (let i = 1; i <= totalImagens; i++) {
                const img = document.createElement("img");
                img.className = "slides";
                img.src = `${BASE_URL}${i}.jpg`;
                img.alt = `Slide ${i}`;
                container.appendChild(img);
            }

            document.getElementById("contador-slides").textContent = `📷 ${totalImagens} imagens`;

            mostrarSlide(0);
            startSlideShow();

            setTimeout(() => {
                document.getElementById("search-status").innerHTML = "";
            }, 2500);
        }

        function mostrarSlide(index) {
            const slides = document.getElementsByClassName("slides");
            if (slides.length === 0) return;

            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }

            if (index >= 0 && index < slides.length) {
                slides[index].style.display = "block";

                const contador = document.getElementById("contador-slides");
                if (contador) {
                    contador.innerHTML = `📸 Slide ${index + 1} de ${slides.length}`;
                }
            }
        }

        function proximoSlide() {
            const slides = document.getElementsByClassName("slides");
            if (slides.length > 0) {
                slideIndex = (slideIndex + 1) % slides.length;
                mostrarSlide(slideIndex);
            }
        }

        function voltarSlide() {
            const slides = document.getElementsByClassName("slides");
            if (slides.length > 0) {
                slideIndex = (slideIndex - 1 + slides.length) % slides.length;
                mostrarSlide(slideIndex);
            }
        }

        function startSlideShow() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(proximoSlide, 3000);
        }

        // Suporte a swipe (mobile)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) proximoSlide();
            if (touchEndX - touchStartX > 50) voltarSlide();
        }, { passive: true });

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') proximoSlide();
            if (e.key === 'ArrowLeft') voltarSlide();
        });

        window.onload = function() {
            carregarImagens();
        };
    </script>
</body>
</html>
